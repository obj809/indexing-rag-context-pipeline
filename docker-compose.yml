# Run-on-demand (no `up -d` — this is a one-shot ops tool, not a service):
#   docker compose run --rm indexer        # drop + rebuild the `chunks` table, then exit
# Prerequisites: cd ../vector-db-rag-context-pipeline && docker compose up -d
#
# Only DATABASE_URL is needed — embedding runs locally, no OpenAI key. The only
# runtime peer is Postgres, reached as db:5432 on the vector-db compose network;
# no webnet (the indexer makes no LLM call, so it never touches the litellm gateway).
services:
  indexer:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag # `db` = service name on the vector-db network
    networks:
      - vector-db

networks:
  vector-db:
    external: true
    name: vector-db-rag-context-pipeline_default
